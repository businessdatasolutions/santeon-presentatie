<text x="300.0" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central"><tspan x="300.0" y="148.0">Rijnstate — Veilig Incidenten Melden (VIM):</tspan><tspan x="300.0" y="167.5">praktijkvoorbeeld met tientallen VIM-teams en duizenden</tspan><tspan x="300.0" y="187.0">meldingen per jaar</tspan></text>
<text x="300.0" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central"><tspan x="300.0" y="241.2">Interne gespreksnotities: triage op ernst, meldvolumes per</tspan><tspan x="300.0" y="260.8">zorgunit</tspan></text>
<text x="616.0" font-size="16" font-weight="600" fill="#4b5563" text-anchor="start" dominant-baseline="central"><tspan x="616.0" y="115.0">Internationaal / techniek</tspan></text>
<text x="860.0" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central"><tspan x="860.0" y="150.2">AccountableHQ, GoAudits, Censinet — incident-reporting</tspan><tspan x="860.0" y="169.8">software en best practices</tspan></text>
<text x="860.0" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central"><tspan x="860.0" y="226.2">PSEBench (arXiv) — benchmark voor AI bij</tspan><tspan x="860.0" y="245.8">patient-safety-triage</tspan></text>
<text x="40.0" font-size="18" font-weight="600" fill="#4b5563" text-anchor="start" dominant-baseline="central"><tspan x="40.0" y="347.0">Het proces, op hoofdlijnen</tspan></text>
<text x="150.0" font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central"><tspan x="150.0" y="434.6">Incident /</tspan><tspan x="150.0" y="455.4">bijna-incident</tspan></text>
<text x="420.0" font-size="15" font-weight="400" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central"><tspan x="420.0" y="435.2">Melden — laagdrempelig,</tspan><tspan x="420.0" y="454.8">iedereen mag melden</tspan></text>
