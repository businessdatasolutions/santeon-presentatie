<!doctype html>

    <div class="uitleg" id="uitleg" aria-live="polite"></div>

    <div class="vraagbalk" id="vraagbalk"></div>
    <div class="kolommen" id="kolommen"></div>
    <div class="as" id="as"></div>
    <div class="kennis-slot" id="kennis-slot" hidden></div>
  </section>
</main>
