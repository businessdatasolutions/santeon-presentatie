<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Van melding naar signaal</title>
<link rel="stylesheet" href="/src/architectuur.css">
</head>
<body data-versie="keten">
<header class="top">
  <div>
    <div class="eyebrow" id="deel">Deel 1 · Hoog over</div>
    <h1 id="kop">Van ruwe melding naar bestuurbaar signaal</h1>
  </div>
  <div class="teller" id="teller" aria-live="polite"></div>
</header>
<div class="voortgang" aria-hidden="true"><i id="balk"></i></div>

<main>
  <section class="scene" id="stapel" aria-label="De vijf lagen">
    <div class="doek" id="doek"><div class="labels" id="labels"></div></div>
    <div class="uitleg" id="uitleg" aria-live="polite"></div>
  </section>

  <section class="scene" id="reis" aria-label="Twee meldingen door het proces" hidden>
    <svg id="rail" viewBox="0 0 1200 150" role="img" aria-label="Zes stations van het proces"></svg>
    <div class="banen" id="banen"></div>
    <div class="dashboard" id="dashboard" hidden></div>
    <div class="uitlegvak" id="uitlegvak" hidden></div>
    <p class="onderschrift" id="onderschrift" aria-live="polite"></p>
  </section>
</main>

<nav class="bediening">
  <button type="button" id="terug" aria-label="Vorige stap">←</button>
  <button type="button" id="verder" class="volgende" aria-label="Volgende stap">→</button>
  <span>Pijltjes, spatie of klikker</span>
  <a href="index.html">Startpagina</a>
  <span class="merk">
    <svg viewBox="0 0 32 32" role="img" aria-label="Logo Business Data Solutions"><g fill="#1a1a1a"><polygon points="9,29 11,10 17,10 19,29"/><polygon points="8,8.5 20,8.5 19,10 9,10"/><rect x="11" y="5" width="6" height="3.5"/><path d="M10.5 5 Q10.5 1.5 14 1.5 Q17.5 1.5 17.5 5 Z"/><rect x="13.5" y="0" width="1" height="1.8"/></g><rect x="13" y="6" width="2" height="2" fill="#d4db3e"/><g stroke="#d4db3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M21 4 L26 7 L21 10"/><path d="M26 4 L31 7 L26 10"/></g></svg>
    Business Data Solutions
  </span>
</nav>

<script type="module" src="/src/architectuur.js"></script>
</body>
</html>
